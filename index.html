<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Гора — карта</title>
  <style>
    :root {
      --glass: rgba(14, 20, 44, 0.62);
      --line: rgba(255, 255, 255, 0.14);
      --text: #eef2ff;
      --muted: #a9b3d6;
      --accent: #ffb04a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1230; color: var(--text);
      font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
    #app canvas { display: block; touch-action: none; }

    #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50;
      background: radial-gradient(circle at 50% 40%, #2a4bd0, #0b1230 70%); transition: opacity .8s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .box { text-align: center; }
    #loading h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: .08em; font-weight: 800; }
    #loading .spin { width: 42px; height: 42px; margin: 18px auto; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.2); border-top-color: var(--accent); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #panel { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; width: 300px; max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px); overflow: auto; padding: 14px; border-radius: 16px; background: var(--glass);
      border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 10; }
    #panel.hidden > :not(.head) { display: none; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .head h2 { margin: 0; font-size: 16px; letter-spacing: .04em; }
    #togglePanel { width: 34px; height: 30px; padding: 0; }
    .sec { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .sec > label, .row > label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
    #timeLabel { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
    input[type=range] { width: 100%; accent-color: var(--accent); margin: 8px 0 4px; }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    button, select { font: inherit; color: var(--text); background: rgba(255,255,255,.08); border: 1px solid var(--line);
      border-radius: 10px; padding: 6px 10px; cursor: pointer; }
    button:hover { background: rgba(255,255,255,.16); }
    button.on { background: var(--accent); color: #1a1206; border-color: transparent; }
    select option { color: #111; }
    .help { color: var(--muted); font-size: 12px; }
    .help b { color: var(--text); font-weight: 600; }
    #stats { color: var(--muted); font-size: 11px; }
    #fps { position: fixed; right: 10px; bottom: 8px; font-size: 11px; color: rgba(255,255,255,.7); z-index: 10;
      text-shadow: 0 1px 2px rgba(0,0,0,.6); }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
      background: rgba(255,255,255,.6); z-index: 5; pointer-events: none; }
    body.noui #panel, body.noui #fps, body.noui #crosshair { display: none; }

    /* сенсорное управление */
    #joy, #vbtns { display: none; }
    body.touch #joy { display: block; position: fixed; width: 120px; height: 120px; left: 30px; bottom: 40px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); z-index: 6; pointer-events: none; opacity: .5; }
    body.touch #joy.on { opacity: 1; }
    #joyKnob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.55); }
    body.touch #vbtns { display: flex; flex-direction: column; gap: 10px; position: fixed; right: 18px; bottom: 40px; z-index: 11; }
    #vbtns button { width: 56px; height: 56px; border-radius: 50%; font-size: 22px; background: rgba(14,20,44,.5); }
    body.touch #crosshair { display: none; }
    body.touch .kbd { display: none; }
    body:not(.touch) .tch { display: none; }
    @media (max-width: 600px) { #panel { width: auto; right: 12px; } #panel:not(.hidden) { max-height: 60vh; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>

  <div id="loading">
    <div class="box">
      <h1>ГОРА</h1>
      <div class="spin"></div>
      <div id="loadText">Загрузка…</div>
    </div>
  </div>

  <div id="panel">
    <div class="head">
      <h2>Гора · свободный полёт</h2>
      <button id="togglePanel" title="Свернуть">☰</button>
    </div>

    <div class="sec">
      <div class="row"><label>Время суток</label><span id="timeLabel">13:00</span></div>
      <input id="time" type="range" min="0" max="24" step="0.05" value="13">
      <div class="btns">
        <button data-hour="7.5">Рассвет</button>
        <button data-hour="13">День</button>
        <button data-hour="18.75">Закат</button>
        <button data-hour="23.5">Ночь</button>
      </div>
      <div class="row"><label for="autoTime">Время идёт само</label><input id="autoTime" type="checkbox"></div>
      <div class="row"><label for="snow">Снегопад</label>
        <select id="snow"><option value="auto">Авто</option><option value="on">Вкл</option><option value="off">Выкл</option></select>
      </div>
    </div>

    <div class="sec">
      <label>Точки обзора</label>
      <div class="btns" id="viewpoints"></div>
      <div class="btns"><button id="tour">Облёт горы</button></div>
    </div>

    <div class="sec">
      <div class="row"><label for="quality">Качество</label><select id="quality"></select></div>
      <div class="row"><label>Скорость полёта</label><span id="speed"></span></div>
    </div>

    <div class="sec help">
      <div class="kbd"><b>Клик</b> — захват мыши, <b>Esc</b> — отпустить<br>
        <b>WASD</b> — полёт, <b>Space/E</b> — вверх, <b>Q/C</b> — вниз<br>
        <b>Shift</b> — ускорение ×4, <b>колесо</b> — скорость<br>
        <b>T</b> — +30 минут, <b>H</b> — скрыть интерфейс</div>
      <div class="tch">Левая часть экрана — джойстик полёта, правая — обзор. Кнопки ▲▼ — высота.</div>
    </div>
    <div class="sec" id="stats"></div>
  </div>

  <div id="joy"><div id="joyKnob"></div></div>
  <div id="vbtns"><button id="btnUp">▲</button><button id="btnDown">▼</button></div>
  <div id="fps"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
