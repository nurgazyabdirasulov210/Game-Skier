<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Долина — карта</title>
<style>
  :root { --ui-bg: rgba(14, 20, 60, 0.42); --ui-fg: #f4f6ff; --ui-on: #ff8a3d; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1440; color: var(--ui-fg);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#1f55d8, #c9dcff);
    transition: opacity .8s; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading h1 { margin: 0 0 8px; font-size: 44px; letter-spacing: .04em; font-weight: 800; }
  #loading p { margin: 0; opacity: .85; text-align: center; }
  #ui { position: fixed; top: 12px; left: 12px; max-width: min(360px, calc(100vw - 24px)); z-index: 5; }
  #ui .panel { background: var(--ui-bg); backdrop-filter: blur(8px); border-radius: 14px; padding: 10px 12px; }
  #ui.collapsed .panel { display: none; }
  #ui h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; opacity: .7; margin: 8px 0 6px; font-weight: 600; }
  #ui h2:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--ui-fg); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    padding: 6px 10px; border-radius: 999px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.22); }
  button.on { background: var(--ui-on); border-color: var(--ui-on); color: #1b0f05; font-weight: 600; }
  #menu-toggle { margin-bottom: 8px; }
  #help { font-size: 12px; opacity: .8; margin-top: 8px; }
  #info { position: fixed; right: 12px; bottom: 10px; font-size: 11px; opacity: .65; z-index: 5; text-shadow: 0 1px 2px #0008; }
  #touch-btns { position: fixed; right: 16px; bottom: 40px; display: none; flex-direction: column; gap: 10px; z-index: 5; }
  #touch-btns button { width: 54px; height: 54px; border-radius: 50%; font-size: 20px; }
  @media (pointer: coarse) { #touch-btns { display: flex; } .desk { display: none; } }
  body.clean #ui, body.clean #info, body.clean #touch-btns { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div><h1>ДОЛИНА</h1><p id="loading-status">Загрузка…</p></div></div>
<div id="ui">
  <button id="menu-toggle">☰ Меню</button>
  <div class="panel">
    <h2>Настроение</h2>
    <div class="row" id="moods"></div>
    <h2>Точки обзора</h2>
    <div class="row" id="views"></div>
    <h2>Пролёт</h2>
    <div class="row">
      <button data-tour="ride">Спуск у снега</button>
      <button data-tour="drone">Над долиной</button>
    </div>
    <div id="help" class="desk">
      Клик — мышь, WASD — полёт, Space/Q — вверх/вниз, Shift — быстрее, колесо — скорость.<br>
      1–5 / T — настроение, R — спуск, H — скрыть интерфейс.
    </div>
  </div>
</div>
<div id="touch-btns"><button id="btn-up">▲</button><button id="btn-down">▼</button></div>
<div id="info"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
